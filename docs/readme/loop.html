<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One session, one item, seven steps</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Loop · joharness</p>
    <h1>One session, one item, seven steps</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 632" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loop-title loop-desc">
        <title id="loop-title">One session, one item, seven steps</title>
        <desc id="loop-desc">The seven-step loop every working session follows, from orient to finish, writing its claim, handover and merge back to git, which the next session reads.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6580"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <path d="M 560.000 95.973 A 236 236 0 0 1 634.051 139.214" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 684.382 200.000 A 236 236 0 0 1 715.081 338.805" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 701.296 400.000 A 236 236 0 0 1 631.163 499.234" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 504.000 552.776 A 236 236 0 0 1 457.194 552.895" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 329.760 500.000 A 236 236 0 0 1 259.124 401.124" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 245.028 340.000 A 236 236 0 0 1 275.021 201.041" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 325.042 140.000 A 236 236 0 0 1 398.872 96.383" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 632.000 352.069 L 581.855 340.830" fill="none" stroke="#5a6580" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
        <path d="M 328.000 352.069 L 378.145 340.830" fill="none" stroke="#5a6580" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
        <path d="M 333.297 200.000 L 420.622 270.239" fill="none" stroke="#5a6580" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
        <rect x="592.8185831715556" y="323.0884349306101" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="610.8185831715556" y="332.0884349306101" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CLAIM</text>
        <rect x="333.25085391778094" y="359.0905388676497" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="357.25085391778094" y="368.0905388676497" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HANDOVER</text>
        <rect x="373.9748738810757" y="210.45215706563368" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="391.9748738810757" y="219.45215706563368" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MERGE</text>
        <rect x="400" y="52" width="160" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="52" width="160" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480.0" y="84.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Orient</text>
        <text x="480.0" y="99.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">read handover state</text>
        <rect x="584" y="140" width="160" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="584" y="140" width="160" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="664.0" y="172.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Pick</text>
        <text x="664.0" y="187.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">finish before starting</text>
        <rect x="632" y="340" width="160" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="632" y="340" width="160" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="712.0" y="372.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Claim</text>
        <text x="712.0" y="387.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">branch, push at once</text>
        <rect x="504" y="500" width="160" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="504" y="500" width="160" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="584.0" y="532.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Build</text>
        <text x="584.0" y="547.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">research, then code</text>
        <rect x="296" y="500" width="160" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="296" y="500" width="160" height="60" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="376.0" y="532.0" fill="#bf4520" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Verify</text>
        <text x="376.0" y="547.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ci + verify, all green</text>
        <rect x="168" y="340" width="160" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="168" y="340" width="160" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="248.0" y="372.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Hand over</text>
        <text x="248.0" y="387.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">write workstream file</text>
        <rect x="216" y="140" width="160" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="216" y="140" width="160" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="296.0" y="172.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Finish</text>
        <text x="296.0" y="187.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PR, merge to main</text>
        <rect x="384.0" y="274.0" width="192" height="88" rx="8" fill="#2d3142"/>
        <text x="480" y="312.0" fill="#f5f5f5" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Git + GitHub</text>
        <text x="480" y="330.0" fill="#d6d8de" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the only memory</text>
        <text x="480" y="343.0" fill="#d6d8de" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">between sessions</text>
      </svg>
    </div>
  </div>
</body>
</html>
