<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What a repo running the harness contains</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · joharness</p>
    <h1>What a repo running the harness contains</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="layers-title layers-desc">
        <title id="layers-title">What a repo running the harness contains</title>
        <desc id="layers-desc">Six layers of a repo running joharness: your docs and settings on top, the synced harness protocol, roles, environment and entrypoint below.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6580"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect x="48" y="40" width="680" height="60" fill="#ececec"/>
        <rect x="48" y="100" width="680" height="60" fill="#ececec"/>
        <rect x="48" y="160" width="680" height="60" fill="#ffffff"/>
        <rect x="48" y="220" width="680" height="60" fill="rgba(191,69,32,0.08)"/>
        <rect x="48" y="280" width="680" height="60" fill="#ffffff"/>
        <rect x="48" y="340" width="680" height="60" fill="#ffffff"/>
        <line x1="48" y1="100" x2="728" y2="100" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <line x1="48" y1="160" x2="728" y2="160" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <line x1="48" y1="220" x2="728" y2="220" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <line x1="48" y1="280" x2="728" y2="280" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <line x1="48" y1="340" x2="728" y2="340" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <rect x="48" y="40" width="680" height="360" rx="6" fill="none" stroke="#2d3142" stroke-width="1"/>
        <rect x="48.5" y="220.5" width="679" height="59" fill="none" stroke="#bf4520" stroke-width="1"/>
        <text x="72" y="74" fill="#5a6580" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">06</text>
        <text x="112" y="67" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif">Your work</text>
        <text x="112" y="83" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">requirements, plans, workstream files</text>
        <text x="704" y="74" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">docs/</text>
        <text x="72" y="134" fill="#5a6580" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">05</text>
        <text x="112" y="127" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif">Your switches</text>
        <text x="112" y="143" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">environment, checks, manager cap</text>
        <text x="704" y="134" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">joharness.conf</text>
        <text x="72" y="194" fill="#5a6580" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">04</text>
        <text x="112" y="187" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif">Roles and hooks</text>
        <text x="112" y="203" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">slash commands, session hook, verifier</text>
        <text x="704" y="194" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">.claude/</text>
        <text x="72" y="254" fill="#bf4520" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">03</text>
        <text x="112" y="247" fill="#bf4520" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif">The protocol</text>
        <text x="112" y="263" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">the Loop, the rules, the reasons</text>
        <text x="704" y="254" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">.agents/harness/  .agents/docs/</text>
        <text x="72" y="314" fill="#5a6580" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">02</text>
        <text x="112" y="307" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif">One environment</text>
        <text x="112" y="323" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">docker, k8s or none, provisioned lazily</text>
        <text x="704" y="314" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">.agents/env/&lt;name&gt;/</text>
        <text x="72" y="374" fill="#5a6580" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">01</text>
        <text x="112" y="367" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif">Entrypoint</text>
        <text x="112" y="383" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">every command and hook goes through it</text>
        <text x="704" y="374" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">joharness.sh</text>
        <path d="M 748,44 H 756 V 156 H 748" fill="none" stroke="#5a6580" stroke-width="1"/>
        <text x="768" y="94.0" fill="#5a6580" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">YOURS</text>
        <text x="768" y="108.0" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">per repo,</text>
        <text x="768" y="122.0" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">never overwritten</text>
        <path d="M 748,164 H 756 V 396 H 748" fill="none" stroke="#2d3142" stroke-width="1"/>
        <text x="768" y="274.0" fill="#2d3142" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">HARNESS</text>
        <text x="768" y="288.0" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">copied from joharness,</text>
        <text x="768" y="302.0" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">kept current by sync</text>
      </svg>
    </div>
  </div>
</body>
</html>
