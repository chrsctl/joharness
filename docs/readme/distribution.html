<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One canonical, many copies</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · joharness</p>
    <h1>One canonical, many copies</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="distribution-title distribution-desc">
        <title id="distribution-title">One canonical, many copies</title>
        <desc id="distribution-desc">joharness is the canonical harness: a new repo is bootstrapped once, kept current by a weekly sync pull request, and sends harness fixes back to joharness first.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6580"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <path d="M 240 100 H 372.0" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 588.0 100 H 720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 240 180 H 372.0" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 588.0 180 H 720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 720 260 H 588.0" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
        <path d="M 372.0 260 H 240" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
        <rect x="292.0" y="80" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="306.0" y="89" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ONCE</text>
        <rect x="636.0" y="80" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="654.0" y="89" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SEEDS</text>
        <rect x="276.0" y="160" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="306.0" y="169" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EVERY WEEK</text>
        <rect x="632.0" y="160" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="654.0" y="169" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SYNC PR</text>
        <rect x="630.0" y="240" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="654.0" y="249" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FINDINGS</text>
        <rect x="278.0" y="240" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="306.0" y="249" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FIX FIRST</text>
        <rect x="40" y="48" width="200" height="264" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="48" width="200" height="264" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="48" y="54" width="48" height="12" rx="2" fill="none" stroke="#bf4520" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="72.0" y="63" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CANONICAL</text>
        <text x="140.0" y="186.0" fill="#bf4520" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle"></text>
        <text x="140.0" y="170.0" fill="#bf4520" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">joharness</text>
        <text x="140.0" y="188.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">every layer, the tools,</text>
        <text x="140.0" y="201.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the selftest</text>
        <rect x="720" y="48" width="200" height="264" rx="6" fill="#f5f5f5"/>
        <rect x="720" y="48" width="200" height="264" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="728" y="54" width="44" height="12" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="750.0" y="63" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CONSUMER</text>
        <text x="820.0" y="186.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle"></text>
        <text x="820.0" y="170.0" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Your repo</text>
        <text x="820.0" y="188.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one layer, your docs/,</text>
        <text x="820.0" y="201.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">your joharness.conf</text>
        <rect x="372.0" y="72.0" width="216" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="372.0" y="72.0" width="216" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480.0" y="102.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Bootstrap</text>
        <text x="480.0" y="117.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">bootstrap-consumer.sh</text>
        <rect x="372.0" y="152.0" width="216" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="372.0" y="152.0" width="216" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480.0" y="182.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Sync</text>
        <text x="480.0" y="197.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">update.yml or upgrade</text>
        <rect x="372.0" y="232.0" width="216" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="372.0" y="232.0" width="216" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.2)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="480.0" y="262.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Upstream report</text>
        <text x="480.0" y="277.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">a pull request on joharness</text>
        <line x1="32" y1="332" x2="928" y2="332" stroke="rgba(45,49,66,0.1)" stroke-width="0.8"/>
        <text x="32" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <line x1="112" y1="349" x2="140" y2="349" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="148" y="352" fill="#2d3142" font-size="10" font-family="'Geist', system-ui, sans-serif">Harness flows out</text>
        <line x1="282.0" y1="349" x2="310.0" y2="349" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="5,4"/>
        <text x="318.0" y="352" fill="#2d3142" font-size="10" font-family="'Geist', system-ui, sans-serif">Fixes flow back in</text>
      </svg>
    </div>
  </div>
</body>
</html>
