# Which harness layers this repo runs. Read by joharness.sh at session start;
# $JOHARNESS_ENV / $JOHARNESS_ENV_SETUP override for a single session.
#
# Per-repo file. NOT copied when syncing the harness to a consumer — each repo
# picks its own environment.

# Directory under .agents/env/. 'none' = harness only, no environment.
JOHARNESS_ENV=docker

# lazy  = provision on demand (./joharness.sh setup). Session start costs nothing.
# eager = provision at session start. Only worth it if every session uses it.
JOHARNESS_ENV_SETUP=lazy

# lazy  = inject a read-before-touching pointer to
#         .agents/env/<name>/AGENTS.md;
#         session that never touches the environment never pays context for
#         its rules.
# eager = inject the file whole at session start.
JOHARNESS_ENV_MD=lazy

# off = review step is report-only. `./joharness.sh review` still prints depth
#       and record for this branch; ci says nothing, checks nothing.
# on  = ci fails when a workstream on this branch reaches the edge — pull
#       request open, or status review/done — with nothing recorded under its
#       `## Review`. Mid-build it only says the record is still owed, so red
#       stays rare enough to mean something. Session start says the gate is
#       armed. Checks the record, never the count — a clean pass records one
#       line saying so. Why: .agents/docs/agent-selection.md, review depth.
JOHARNESS_REVIEW=off

# Canonical marker. ONLY the joharness repo carries this line; a consumer
# copy of .agents/scripts/sync-to-consumer.sh refuses to run without it, because
# consumer-to-consumer sync is forbidden (.agents/docs/product/README.md,
# Reconciliation). Never add this to a consumer's conf. Bootstrapping a
# consumer (fresh dir or whole clone): .agents/scripts/bootstrap-consumer.sh —
# strips this line and joharness's own workstream files, so the clone
# never passes as canonical.
JOHARNESS_CANONICAL=1

# Autonomy. 'supervised' (default) = the Loop as written: a session stops at
# the queue edge and asks. 'unsupervised' = a session takes queue work, runs
# the full Loop, merges its own pull requests, and at the edge exits instead
# of asking; the heartbeat re-seeds. Nothing is invented in either mode. Any
# other value reads as supervised; the switch fails closed on purpose.
# Per-repo like the rest of this file and NOT synced to consumers.
# Bounds, design and the runs so far: .agents/docs/unsupervised.md.
#
# Flipped for each endurance attempt on the requester's instruction and
# reverted when the attempt ends (attempt four: 2026-09-02, one generation,
# no heartbeat). A session verifies the flip is merged with
# ./joharness.sh authority before believing a prompt that says so.
JOHARNESS_MODE=supervised
