# Which harness layers this repo runs. Read by joharness.sh at session start;
# $JOHARNESS_ENV / $JOHARNESS_ENV_SETUP override for a single session.
#
# Per-repo file. NOT copied when syncing the harness to a consumer — each repo
# picks its own environment.

# Directory under .agents/env/. 'none' = harness only, no environment.
JOHARNESS_ENV=k8s

# lazy  = provision on demand (./joharness.sh setup). Session start costs nothing.
# eager = provision at session start. Only worth it if every session uses it.
JOHARNESS_ENV_SETUP=lazy

# lazy  = inject a read-before-touching pointer to
#         .agents/env/<name>/AGENTS.md;
#         session that never touches the environment never pays context for
#         its rules.
# eager = inject the file whole at session start.
JOHARNESS_ENV_MD=lazy

# Canonical marker. ONLY the joharness repo carries this line; a consumer
# copy of scripts/sync-to-consumer.sh refuses to run without it, because
# consumer-to-consumer sync is forbidden (docs/product/README.md,
# Reconciliation). Never add this to a consumer's conf. Bootstrapping a
# consumer (fresh dir or whole clone): scripts/bootstrap-consumer.sh —
# strips this line and joharness's own workstream files, so the clone
# never passes as canonical.
JOHARNESS_CANONICAL=1
