name: prune-branches

# Deletes branches that hold nothing `main` lacks AND that no harness reader
# still counts, so `git fetch` and every walk over refs/remotes/origin stay
# short. One daily sweep; nothing is deleted the moment it merges.
#
# A branch goes only when one of these holds:
#
# - merged by ancestry (a merged pull request's head, an empty clerk or
#   curate pass) and its tip is at least 24h old. Every protocol reader of
#   branch state reads UNMERGED refs (joharness.sh: clerk_walk, scout_walk,
#   conduct_due, retro_due, dispatch_curate_branches, cl_inflight); merged
#   commits stay reachable from main under the merge-commit method, so the
#   workstream-file recovery command a pull request body carries still works.
# - unmerged with NO net change against its merge base, and older than the
#   window after which the harness itself stops counting it:
#     clerk-<digit>...            JOHARNESS_CLERK_STALE_HOURS (0 = never)
#     conduct-/retro-<digit>...   a seventh of JOHARNESS_CONDUCT_HOURS /
#                                 JOHARNESS_RETRO_HOURS, at least 24h
#     anything else               HANDOVER_STALE_SECONDS
#   Knobs are read as dispatch reads them: environment, then the default
#   branch's joharness.conf, then the harness default.
#
# Never deleted: the default branch; a branch an open pull request rides; the
# newest `clerk-noop-*` and newest `curate-noop-*` — each IS its role's clock
# (joharness.sh: clerk_noop, curate_noop read merged refs of that name); an
# unmerged branch with any net change — abandoned work is a human's to
# triage, never an age-out. Sessions still never `git push --delete`
# (.agents/harness/AGENTS.md step 7); this file is the human's.
#
# Cost: one runner minute a day on a private repo.

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted, delete nothing
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prune-branches
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ github.event.repository.default_branch }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      MIN_AGE_HOURS: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: delete merged and empty branches
        run: |
          set -euo pipefail
          git fetch -q --prune origin '+refs/heads/*:refs/remotes/origin/*'
          base="refs/remotes/origin/${BASE}"
          # <key> <default>: environment, then the base's conf, then the default.
          knob() {
            local v="${!1:-}"
            [ -n "$v" ] || v="$(git show "${base}:joharness.conf" 2>/dev/null |
              sed -n "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*\([0-9]*\).*/\1/p" | tail -n 1)"
            printf '%s' "${v:-$2}"
          }
          seventh() { local d=$(( ($1 + 6) / 7 )); [ "$d" -ge 24 ] || d=24; printf '%s' "$d"; }
          clerk_h="$(knob JOHARNESS_CLERK_STALE_HOURS 24)"
          conduct_h="$(seventh "$(knob JOHARNESS_CONDUCT_HOURS 168)")"
          retro_h="$(seventh "$(knob JOHARNESS_RETRO_HOURS 168)")"
          other_h=$(( $(knob HANDOVER_STALE_SECONDS 518400) / 3600 ))
          echo "windows: clerk ${clerk_h}h, conduct ${conduct_h}h, retro ${retro_h}h, other ${other_h}h, merged ${MIN_AGE_HOURS}h"
          now="$(date +%s)"
          open="$(gh pr list --state open --limit 1000 --json headRefName --jq '.[].headRefName')"
          keep="$(for k in clerk-noop curate-noop; do
            git for-each-ref --format='%(refname:lstrip=3)' "refs/remotes/origin/${k}-*" | sort | tail -n 1
          done)"
          merged="$(git for-each-ref --merged="$base" --format='%(refname:lstrip=3)' refs/remotes/origin)"
          del=()
          while IFS=$'\t' read -r name ct; do
            { [ "$name" = "$BASE" ] || [ "$name" = HEAD ]; } && continue
            grep -qxF -- "$name" <<<"$open" && continue
            grep -qxF -- "$name" <<<"$keep" && continue
            age=$(( (now - ct) / 3600 ))
            [ "$age" -ge "$MIN_AGE_HOURS" ] || continue
            if grep -qxF -- "$name" <<<"$merged"; then
              why=merged
            else
              mb="$(git merge-base "$base" "refs/remotes/origin/${name}")" || continue
              git diff --quiet "$mb" "refs/remotes/origin/${name}" || continue
              case "$name" in
                clerk-[0-9]*) win="$clerk_h" ;;
                *) case "${name##*/}" in
                     conduct-[0-9]*) win="$conduct_h" ;;
                     retro-[0-9]*) win="$retro_h" ;;
                     *) win="$other_h" ;;
                   esac ;;
              esac
              # A window of 0 = every such branch holds: never deleted.
              { [ "$win" -gt 0 ] && [ "$age" -ge "$win" ]; } || continue
              why=empty
            fi
            printf '%-6s %5sh  %s\n' "$why" "$age" "$name"
            del+=("$name")
          done < <(git for-each-ref --format='%(refname:lstrip=3)%09%(committerdate:unix)' refs/remotes/origin)
          echo "${#del[@]} branch(es) to delete"
          if [ "$DRY_RUN" = true ] || [ "${#del[@]}" -eq 0 ]; then
            exit 0
          fi
          failed=0
          for ((i = 0; i < ${#del[@]}; i += 50)); do
            git push -q origin --delete "${del[@]:i:50}" || failed=1
          done
          exit "$failed"
