name: ci

# `main` is built on push, branches by their pull request — the split gx
# measured (25 of 65 SHAs built twice under `on: [push, pull_request]`) applies
# here unchanged.
on:
  push:
    branches: [main]
  pull_request:

# Main pushes get a per-sha group: GitHub keeps at most one running plus one
# PENDING run per group, and each newly arriving run evicts the pending one
# regardless of cancel-in-progress — which dropped two of the three main
# runs when merges landed 15s apart (2026-08-23), exactly the runs that
# catch cross-PR collisions no per-PR gate can see. Distinct groups mean
# nothing shares a queue slot: every merge commit keeps its own verdict,
# in parallel. Branch/PR runs keep the shared per-ref group and cancel
# superseded runs as before.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The harness is shell; shellcheck at zero findings is its acceptance bar
  # (AGENTS.md). Every layer is covered: the entrypoint, .agents/harness/,
  # and each .agents/env/<name>/ whether or not this repo selects it. The
  # runner image ships
  # shellcheck, so this is seconds.
  #
  # The checks live in `joharness.sh ci`, not in this file, so a session can run
  # exactly what CI runs before opening the pull request instead of finding out
  # afterwards.
  #
  # Environment smoke tests are NOT here — see the verify job below for the
  # ones that are. A layer needing the sandbox this repo provisions
  # (Docker-in-Docker, the egress proxy, the cgroup v1 kernel) exercises
  # constraints a GitHub runner has none of, so a green run here would claim
  # more than it checked; `./joharness.sh verify` in the sandbox is where
  # those get proven. A layer that needs none of it says so itself, and the
  # verify job runs it.
  lint:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default depth 1: the graph lint resolves
      # names against HEAD's history to tell a typo from a merged-and-
      # deleted plan. On a shallow checkout it degrades those reds to
      # warnings (it cannot prove a typo there), so depth 1 here would
      # run a weaker gate than a local `./joharness.sh ci`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: joharness ci
        run: ./joharness.sh ci

  # Continuous coverage for the environment layers that can prove themselves
  # on a stock runner. A layer opts in by carrying a `ci-verify` file
  # (.agents/env/README.md); this job globs for it and names no layer, which
  # is what lets the file be seeded verbatim into every consumer: a repo
  # whose layer does not declare it gets a job that says so and passes,
  # never one flailing at a layer it does not have.
  #
  # What a green here means, exactly: THAT layer's setup and smoke test pass
  # on a runner. It is never a substitute for `./joharness.sh verify` on the
  # layer a repo selects — this repo selects one that needs the sandbox, so
  # here the job is layer coverage and step 7 still asks for the real run.
  # In a consumer that both selects a declaring layer and merges on this
  # workflow, it is the same check step 7 asks for, run by machine.
  #
  # The registry is a precondition, not the thing under test: pulls are
  # retried, and if the registry stays unreachable (Docker Hub rate-limits
  # shared runner IPs, and fork pull requests carry no secrets to log in
  # with) the job warns and passes. A gate that reds on someone else's rate
  # limit teaches the override. A check that actually fails is still red.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: layers that declare themselves CI-runnable
        id: layers
        run: |
          set -euo pipefail
          found=""
          for d in .agents/env/*/; do
            [ -d "$d" ] || continue
            name="$(basename "$d")"
            [ -f "${d}ci-verify" ] || continue
            [ -x "${d}smoke-test.sh" ] || continue
            found="${found}${found:+ }${name}"
          done
          if [ -z "$found" ]; then
            echo "no layer here declares itself CI-runnable; nothing to verify"
          else
            echo "declared: ${found}"
          fi
          echo "names=${found}" >>"$GITHUB_OUTPUT"
      - name: pull the images those layers need
        id: images
        if: steps.layers.outputs.names != ''
        run: |
          set -uo pipefail
          # Every image any declaring layer runs, pulled here so a registry
          # problem is one warning instead of a red check per layer.
          ok=1
          for image in alpine:3 nginx:alpine; do
            pulled=0
            for attempt in 1 2 3; do
              if docker pull "$image" >/dev/null 2>&1; then pulled=1; break; fi
              echo "pull of ${image} failed (attempt ${attempt}/3); retrying"
              sleep $((attempt * 10))
            done
            [ "$pulled" -eq 1 ] || { ok=0; echo "::warning::could not pull ${image}"; }
          done
          echo "ok=${ok}" >>"$GITHUB_OUTPUT"
          if [ "$ok" -ne 1 ]; then
            echo "::warning::registry unreachable or rate-limited — skipping layer verify rather than failing on it"
          fi
      - name: joharness verify, per declaring layer
        if: steps.layers.outputs.names != '' && steps.images.outputs.ok == '1'
        run: |
          set -euo pipefail
          for name in ${{ steps.layers.outputs.names }}; do
            echo "== verify: ${name}"
            JOHARNESS_ENV="$name" ./joharness.sh verify
          done

  # Windows is where the harness breaks silently. Two defects in two days were
  # invisible from macOS and Linux and fatal on a stock Git for Windows clone:
  # core.autocrlf=true turning every script CRLF until .gitattributes pinned
  # them, and `git rev-parse --show-toplevel` answering in Windows form while
  # `pwd -P` answers in MSYS form, which made sync-to-consumer.sh refuse every
  # checkout as nested inside itself.
  #
  # Different question from the job above, so a separate check rather than a
  # matrix: that one asks "does the code pass its acceptance bar", this one
  # asks "does it run on Git Bash". shellcheck is deliberately not repeated
  # here - the toolchain answer does not change per platform, and installing
  # it on a Windows runner is a path to maintain for nothing.
  windows:
    # Disabled 2026-08-27 at owner request ("for now") — delete the `if`
    # line to re-enable. Skipped, not removed: the job definition and its
    # reasoning above stay current. While off, the Windows-blind-spot
    # class (CRLF, path-form defects — four found to date) has no gate:
    # the selftest's CRLF assertions still run, but only on Linux.
    if: false
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # This file is seeded verbatim into every consumer, and the selftest
      # is canonical-only — a consumer carries no harness tests to run, so
      # the job says that instead of failing on a missing file.
      - name: harness selftest on Git Bash
        run: |
          if [ -f ./.agents/harness/selftest.sh ]; then
            ./.agents/harness/selftest.sh
          else
            echo "no .agents/harness/selftest.sh here (canonical-only); nothing to run"
          fi
