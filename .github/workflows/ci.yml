name: ci

# `main` is built on push, branches by their pull request — the split gx
# measured (25 of 65 SHAs built twice under `on: [push, pull_request]`) applies
# here unchanged.
on:
  push:
    branches: [main]
  pull_request:

# Main pushes get a per-sha group: GitHub keeps at most one running plus one
# PENDING run per group, and each newly arriving run evicts the pending one
# regardless of cancel-in-progress — which dropped two of the three main
# runs when merges landed 15s apart (2026-08-23), exactly the runs that
# catch cross-PR collisions no per-PR gate can see. Distinct groups mean
# nothing shares a queue slot: every merge commit keeps its own verdict,
# in parallel. Branch/PR runs keep the shared per-ref group and cancel
# superseded runs as before.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The harness is shell; shellcheck at zero findings is its acceptance bar
  # (AGENTS.md). Every layer is covered: the entrypoint, .agents/harness/,
  # and each .agents/env/<name>/ whether or not this repo selects it. The
  # runner image ships
  # shellcheck, so this is seconds.
  #
  # THIS job's FIRST step lives in `joharness.sh ci`, not in this file, so a
  # session can run it before opening the pull request instead of finding out
  # afterwards. The second step is the part `ci` does not cover — run that
  # layer's `verify` too before reading a green `ci` as a green PR.
  #
  # Environment smoke tests are NOT here — see the verify step below for the
  # ones that are. A layer needing the sandbox this repo provisions
  # (Docker-in-Docker, the egress proxy, the cgroup v1 kernel) exercises
  # constraints a GitHub runner has none of, so a green run here would claim
  # more than it checked; `./joharness.sh verify` in the sandbox is where
  # those get proven. A layer that needs none of it says so itself, and the
  # verify step runs it.
  lint:
    runs-on: ubuntu-latest
    # The backstop for a job that hangs rather than fails. Without it the
    # ceiling is GitHub's default of 360 minutes, which is six hours of a
    # machine nobody is watching for a suite that finishes in under three.
    # Not hypothetical: a selftest change on #209 blocked on a pty read that
    # never returned — a pty reports no end of file while its master is open —
    # and a local kill was the only thing that ended it.
    #
    # 15 because the twelve consecutive completed runs before this one spanned
    # 2m04s to 2m41s, counted as `updated_at - run_started_at` over runs 471
    # to 482 of THIS repo from the Actions API, counted 2026-09-04. That is
    # 5.6x the slowest of them, which leaves a cold runner and an image pull
    # room to be slow without leaving a hang room to run for hours.
    #
    # Whose runs matters: this file is seeded verbatim into every consumer and
    # never synced afterwards, so a repo that took it inherited canonical's
    # numbers and not its own. A consumer whose `ci` does more, or whose
    # layers pull more images, should re-count here and raise this — a
    # legitimate run killed at 15 minutes reads exactly like the hang this
    # guards. Re-count before moving it either way: a number here that nobody
    # can reproduce is worse than no number.
    timeout-minutes: 15
    steps:
      # Full history, not the default depth 1: the graph lint resolves
      # names against HEAD's history to tell a typo from a merged-and-
      # deleted plan. On a shallow checkout it degrades those reds to
      # warnings (it cannot prove a typo there), so depth 1 here would
      # run a weaker gate than a local `./joharness.sh ci`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: joharness ci
        run: ./joharness.sh ci
      # Continuous coverage for the environment layers that can prove themselves
      # on a stock runner. A layer opts in by carrying a `ci-verify` file
      # (.agents/env/README.md); this step globs for it and names no layer, which
      # is what lets the file be seeded verbatim into every consumer: a repo
      # whose layer does not declare it gets a step that says so and passes,
      # never one flailing at a layer it does not have. The images a layer needs
      # are declared in its own marker, so this file carries no layer's data
      # either.
      #
      # What a green here means, exactly: for each declaring layer, either its
      # setup and smoke test passed on a runner, or the log says that layer was
      # SKIPPED. Nothing here is a substitute for `./joharness.sh verify` on the
      # layer a repo selects, and a session must read this run rather than infer
      # from the marker that a machine did the work (.agents/harness/AGENTS.md
      # step 7) — a skipped layer is a green tick over an unproven layer.
      #
      # The logic lives in .agents/scripts/ci-verify-layers.sh, not in a block
      # of YAML here: shell inline in a workflow is shell nothing shellchecks and
      # nothing tests, and this gate grew a silent hole there before the move.
      # That script's header states what a green means, how an unreachable
      # registry is absorbed, and which cases stay red.
      #
      # A STEP of `lint` rather than a job of its own, since 2026-08-31. It
      # is eight seconds of work (measured, run 33422323923) and Actions
      # bills per job rounded up to the minute, so as a job it charged a
      # third of a healthy run's bill for a fortieth of its work — a
      # round-up, with nothing in it to make faster. Nothing here needed a
      # runner of its own: the header above argues why this check exists and
      # why its logic is a script rather than inline YAML, neither of which
      # is an argument for a second machine. Free in this public repo and
      # not in the private consumers bootstrap-consumer.sh seeds this file
      # into, which is who pays it.
      #
      # `!cancelled()`, so a red first step still produces the layer
      # verdict. As a separate job it could not be hidden that way, and a
      # fold that quietly made one red mask the other would be buying the
      # minute with coverage. It does NOT mask the red: the condition
      # decides whether this step RUNS, never what the job concludes, so a
      # failed `joharness ci` still fails the job.
      #
      # Not `always()`, which is the same thing plus cancellation — and a
      # cancelled run is one nobody will read a verdict from. Three of this
      # repo's 28 runs on 2026-08-31 were cancelled, so that case is not
      # hypothetical here.
      #
      # The job's `timeout-minutes` counts as cancellation too, so a run that
      # hits the cap skips this step and produces no layer verdict. That is
      # the same trade as above rather than an exception to it: a job killed
      # for hanging is one nobody reads a verdict from, and the thing to read
      # is which step it died in. Written down because the cap and this
      # condition were added by different changes and the interaction is
      # invisible from either one alone.
      - name: verify each layer that declares itself CI-runnable
        if: ${{ !cancelled() }}
        run: .agents/scripts/ci-verify-layers.sh

  # Windows is where the harness breaks silently. Two defects in two days were
  # invisible from macOS and Linux and fatal on a stock Git for Windows clone:
  # core.autocrlf=true turning every script CRLF until .gitattributes pinned
  # them, and `git rev-parse --show-toplevel` answering in Windows form while
  # `pwd -P` answers in MSYS form, which made sync-to-consumer.sh refuse every
  # checkout as nested inside itself.
  #
  # Different question from the job above, so a separate check rather than a
  # matrix: that one asks "does the code pass its acceptance bar", this one
  # asks "does it run on Git Bash". shellcheck is deliberately not repeated
  # here - the toolchain answer does not change per platform, and installing
  # it on a Windows runner is a path to maintain for nothing.
  windows:
    # NOT a measurement, unlike the cap above: this job is disabled and has no
    # runs to count. 60 is a bound picked to be strictly better than the
    # 360-minute default while staying clear of the first re-enabled run —
    # this job calls selftest.sh directly with no inert-diff skip, on a
    # platform several times slower at spawning the processes that suite
    # spawns, and a cap that cancelled that run would destroy the very count
    # the next line asks for. Whoever re-enables the job takes the count and
    # replaces this number with one.
    timeout-minutes: 60
    # Disabled 2026-08-27 at owner request ("for now") — delete the `if`
    # line to re-enable. Skipped, not removed: the job definition and its
    # reasoning above stay current. While off, the Windows-blind-spot
    # class (CRLF, path-form defects — four found to date) has no gate:
    # the selftest's CRLF assertions still run, but only on Linux.
    if: false
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # This file is seeded verbatim into every consumer, and the selftest
      # is canonical-only — a consumer carries no harness tests to run, so
      # the job says that instead of failing on a missing file.
      - name: harness selftest on Git Bash
        run: |
          if [ -f ./.agents/harness/selftest.sh ]; then
            ./.agents/harness/selftest.sh
          else
            echo "no .agents/harness/selftest.sh here (canonical-only); nothing to run"
          fi
